<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAC 2026 — Volunteer Certificate of Recognition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@1,600;1,700&display=swap" rel="stylesheet">
    <style>
        /* ===== RESET & BASE ===== */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f0f2f5;
            color: #1a1a2e;
            min-height: 100vh;
            -webkit-text-size-adjust: 100%;
            overflow-x: hidden;
        }

        /* ===== HEADER ===== */
        .app-header {
            background: linear-gradient(135deg, #1a1a6c 0%, #2d2d8c 50%, #c2185b 100%);
            color: #fff;
            padding: 28px 40px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            position: relative;
        }
        .app-header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .app-header p {
            font-size: 0.9rem;
            opacity: 0.9;
            font-weight: 300;
        }
        .nav-switch {
            display: inline-block;
            margin-top: 10px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 6px 14px;
            color: #fff;
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .nav-switch:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-1px);
        }

        /* ===== MAIN LAYOUT ===== */
        .app-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        /* ===== FORM CARD ===== */
        .form-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            padding: 36px 40px;
            margin-bottom: 32px;
            border: 1px solid #e8eaed;
        }
        .form-card h2 {
            font-size: 1.25rem;
            font-weight: 700;
            color: #1a1a6c;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .form-card h2 .icon { font-size: 1.4rem; }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px 28px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group.full-width { grid-column: 1 / -1; }

        .form-group label {
            font-size: 0.82rem;
            font-weight: 600;
            color: #444;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }
        .form-group label .required { color: #c2185b; margin-left: 2px; }

        .form-group input {
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: #fafafa;
            color: #1a1a2e;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
            outline: none;
            width: 100%;
        }
        .form-group input:focus {
            border-color: #1a1a6c;
            box-shadow: 0 0 0 3px rgba(26, 26, 108, 0.1);
            background: #fff;
        }
        .form-group input::placeholder { color: #aaa; }

        .form-actions {
            grid-column: 1 / -1;
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }

        .btn {
            font-family: 'Inter', sans-serif;
            font-size: 0.92rem;
            font-weight: 600;
            padding: 13px 28px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active { transform: scale(0.97); }

        .btn-primary {
            background: linear-gradient(135deg, #1a1a6c, #2d2d8c);
            color: #fff;
            box-shadow: 0 4px 14px rgba(26, 26, 108, 0.3);
        }
        .btn-primary:hover {
            box-shadow: 0 6px 20px rgba(26, 26, 108, 0.45);
            transform: translateY(-1px);
        }

        .btn-success {
            background: linear-gradient(135deg, #0d8043, #10a854);
            color: #fff;
            box-shadow: 0 4px 14px rgba(13, 128, 67, 0.3);
        }
        .btn-success:hover {
            box-shadow: 0 6px 20px rgba(13, 128, 67, 0.45);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #f0f2f5;
            color: #444;
            border: 2px solid #ddd;
        }
        .btn-secondary:hover {
            background: #e4e6e9;
            border-color: #ccc;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ===== CERTIFICATE PREVIEW SECTION ===== */
        .preview-section {
            display: none;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            padding: 36px 40px;
            border: 1px solid #e8eaed;
        }
        .preview-section.visible { display: block; }

        .preview-section h2 {
            font-size: 1.25rem;
            font-weight: 700;
            color: #1a1a6c;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .preview-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
        }

        /* ===== CERTIFICATE CONTAINER ===== */
        .certificate-container {
            position: relative;
            width: 100%;
            max-width: 960px;
            aspect-ratio: 2000 / 1414;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
            background: #fff;
        }
        .certificate-container img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: fill;
        }

        /* ===== NAME OVERLAY ON CERTIFICATE ===== */
        .name-overlay {
            position: absolute;
            left: 54%;
            top: 40.5%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            width: 60%;
            max-width: 60%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: visible;
        }
        .name-overlay .name-text {
            font-family: 'Georgia', 'Times New Roman', serif;
            font-weight: 500;
            font-style: italic;
            color: #1a1a2e;
            white-space: nowrap;
            line-height: 1.1;
            text-shadow: 0 0 4px rgba(255, 255, 255, 0.85);
            display: inline-block;
            transform-origin: center center;
        }

        /* ===== ROLE OVERLAY ON CERTIFICATE ===== */
        .role-overlay {
            position: absolute;
            left: 54%;
            top: 53.8%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            width: 58%;
            max-width: 58%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: visible;
        }
        .role-overlay .role-text {
            font-family: 'Georgia', 'Times New Roman', serif;
            font-weight: 700;
            color: #c2185b;
            white-space: nowrap;
            line-height: 1.1;
            padding: 2px 10px;
            background: #ffffff;
            border-radius: 4px;
            display: inline-block;
            transform-origin: center center;
            box-shadow: 0 0 2px rgba(255, 255, 255, 0.9);
        }

        .preview-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* ===== ADMIN BAR ===== */
        .admin-bar {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px 32px;
        }
        .admin-toggle {
            font-family: 'Inter', sans-serif;
            font-size: 0.78rem;
            color: #aaa;
            background: none;
            border: 1px dashed #ddd;
            border-radius: 8px;
            padding: 8px 16px;
            cursor: pointer;
            transition: color 0.2s, border-color 0.2s;
        }
        .admin-toggle:hover { color: #666; border-color: #aaa; }

        .admin-panel {
            display: none;
            background: #fff;
            border-radius: 12px;
            padding: 20px 24px;
            margin-top: 12px;
            border: 1px solid #e8eaed;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }
        .admin-panel.visible {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .admin-panel .count { font-size: 0.88rem; color: #666; }
        .admin-panel .count strong { color: #1a1a6c; }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 28px;
            right: 28px;
            background: #1a1a6c;
            color: #fff;
            padding: 14px 24px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 500;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.3s, transform 0.3s;
            pointer-events: none;
            z-index: 1000;
            max-width: 90vw;
        }
        .toast.show { opacity: 1; transform: translateY(0); }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .app-header { padding: 22px 20px; }
            .app-header h1 { font-size: 1.3rem; }
            .app-header p { font-size: 0.82rem; }
            .app-container { padding: 20px 16px; }
            .form-card { padding: 28px 20px; border-radius: 12px; }
            .form-card h2 { font-size: 1.1rem; margin-bottom: 18px; }
            .form-grid { grid-template-columns: 1fr; gap: 16px; }
            .preview-section { padding: 24px 16px; border-radius: 12px; }
            .preview-section h2 { font-size: 1.1rem; margin-bottom: 16px; }
            .preview-actions { flex-direction: column; align-items: stretch; }
            .preview-actions .btn { width: 100%; }
            .admin-bar { padding: 0 16px 24px; }
        }

        @media (max-width: 480px) {
            body { background: #fff; }
            .app-header { padding: 18px 14px; }
            .app-header h1 { font-size: 1.1rem; }
            .app-header p { font-size: 0.75rem; }
            .app-container { padding: 12px 8px; }
            .form-card { padding: 20px 14px; margin-bottom: 20px; }
            .form-group input { font-size: 16px; padding: 11px 14px; }
            .form-actions { flex-direction: column; gap: 10px; }
            .form-actions .btn { width: 100%; padding: 14px 20px; }
            .preview-section { padding: 16px 8px; }
            .toast { bottom: 16px; right: 16px; left: 16px; text-align: center; }
            .admin-bar { padding: 0 8px 20px; }
            .admin-panel.visible { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="app-header">
        <h1>SAC 2026 Volunteer Certificate</h1>
        <p>Certificate of Recognition for Dedicated Volunteers &amp; Team Members</p>
        <a href="index.html" class="nav-switch">&larr; Switch to Participant Certificate</a>
    </header>

    <div class="app-container">

        <!-- INPUT FORM -->
        <section class="form-card">
            <h2><span class="icon">&#9998;</span> Volunteer Details</h2>
            <form id="volunteerForm" class="form-grid" novalidate>
                <div class="form-group">
                    <label for="fullName">Full Name <span class="required">*</span></label>
                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="e.g. Emmanuel Bayode"
                        required
                        autocomplete="name"
                    >
                </div>
                <div class="form-group">
                    <label for="role">Role / Department <span class="required">*</span></label>
                    <input
                        type="text"
                        id="role"
                        name="role"
                        placeholder="e.g. Technical & Media Director"
                        required
                    >
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="generateBtn">
                        &#127915; Generate Volunteer Certificate
                    </button>
                    <button type="reset" class="btn btn-secondary" id="resetBtn">
                        Clear Form
                    </button>
                </div>
            </form>
        </section>

        <!-- CERTIFICATE PREVIEW -->
        <section class="preview-section" id="previewSection">
            <h2><span class="icon">&#127942;</span> Certificate Preview</h2>
            <div class="preview-wrapper">
                <div class="certificate-container" id="certificateContainer">
                    <img src="volunteer-template.jpg" alt="SAC 2026 Volunteer Certificate Template" id="templateImg" crossorigin="anonymous">
                    <div class="name-overlay" id="nameOverlay">
                        <span class="name-text" id="nameDisplay"></span>
                    </div>
                    <div class="role-overlay" id="roleOverlay">
                        <span class="role-text" id="roleDisplay"></span>
                    </div>
                </div>
            </div>
            <div class="preview-actions">
                <button class="btn btn-success" id="downloadBtn">
                    &#128190; Download Certificate as Image
                </button>
                <button class="btn btn-secondary" id="newCertBtn">
                    &#10133; Generate Another
                </button>
            </div>
        </section>
    </div>

    <!-- ADMIN BAR -->
    <div class="admin-bar">
        <button class="admin-toggle" id="adminToggle">&#9881; Admin</button>
        <div class="admin-panel" id="adminPanel">
            <span class="count">Generated: <strong id="regCount">0</strong> certificate(s)</span>
            <button class="btn btn-secondary" id="exportCsvBtn" disabled>
                &#128203; Export Volunteer Log (CSV)
            </button>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <script>
        // ============================================================
        //  CONFIG & STATE
        // ============================================================
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz0_HI1_SU12FTwhLtEyReV3TFGKLjK5F4i557ELy53Q8VS-rZ-TxjjFOy8UCt1-vA2Tg/exec";
        const volunteerRegistrations = [];

        // Internal certificate dimensions matching template resolution
        const CERT_WIDTH  = 2000;
        const CERT_HEIGHT = 1414;

        // ============================================================
        //  DOM REFS
        // ============================================================
        const form           = document.getElementById('volunteerForm');
        const generateBtn    = document.getElementById('generateBtn');
        const previewSection = document.getElementById('previewSection');
        const nameDisplay    = document.getElementById('nameDisplay');
        const roleDisplay    = document.getElementById('roleDisplay');
        const certificateEl  = document.getElementById('certificateContainer');
        const templateImg    = document.getElementById('templateImg');
        const downloadBtn    = document.getElementById('downloadBtn');
        const newCertBtn     = document.getElementById('newCertBtn');
        const resetBtn       = document.getElementById('resetBtn');
        const exportCsvBtn   = document.getElementById('exportCsvBtn');
        const regCount       = document.getElementById('regCount');
        const adminToggle    = document.getElementById('adminToggle');
        const adminPanel     = document.getElementById('adminPanel');
        const toast          = document.getElementById('toast');

        // ============================================================
        //  DYNAMIC TEXT AUTO-FIT FOR RESPONSIVE PREVIEW
        // ============================================================
        function fitCertificateTexts() {
            fitElementText('nameOverlay', 'nameDisplay', 0.033, 0.015);
            fitElementText('roleOverlay', 'roleDisplay', 0.020, 0.012);
        }

        function fitElementText(overlayId, textId, idealRatio, minRatio) {
            const overlay = document.getElementById(overlayId);
            const textEl = document.getElementById(textId);
            const cert = document.getElementById('certificateContainer');
            if (!overlay || !textEl || !cert) return;
            const text = (textEl.textContent || '').trim();
            if (!text) return;

            const certWidth = cert.clientWidth;
            if (certWidth === 0) return;

            let fontSize = certWidth * idealRatio;
            textEl.style.fontSize = fontSize + 'px';
            textEl.style.transform = 'none';

            const availableWidth = overlay.clientWidth;
            const minFontSize = Math.max(8, certWidth * minRatio);

            while (textEl.scrollWidth > availableWidth && fontSize > minFontSize) {
                fontSize -= 0.5;
                textEl.style.fontSize = fontSize + 'px';
            }

            if (textEl.scrollWidth > availableWidth) {
                const scale = availableWidth / textEl.scrollWidth;
                textEl.style.transform = 'scale(' + Math.max(0.55, scale) + ')';
            }
        }

        window.addEventListener('resize', fitCertificateTexts);
        window.addEventListener('orientationchange', function () {
            setTimeout(fitCertificateTexts, 150);
        });
        if (window.ResizeObserver) {
            new ResizeObserver(fitCertificateTexts).observe(certificateEl);
        }
        templateImg.addEventListener('load', fitCertificateTexts);

        // ============================================================
        //  FORM SUBMISSION
        // ============================================================
        form.addEventListener('submit', function (e) {
            e.preventDefault();

            const name = document.getElementById('fullName').value.trim();
            const role = document.getElementById('role').value.trim();

            if (!name || !role) {
                showToast('Please fill in both Name and Role.');
                return;
            }

            generateBtn.disabled = true;
            generateBtn.textContent = '⏳ Generating Certificate...';

            const payload = {
                fullName: name,
                role: role,
                type: 'volunteer'
            };

            // Optional background log to Apps Script
            fetch(WEB_APP_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            }).catch(function (err) {
                console.warn('Apps Script log note:', err);
            }).finally(function () {
                recordRegistration(name, role);
                showCertificate(name, role);
                showToast('Volunteer Certificate generated for ' + name);
                generateBtn.disabled = false;
                generateBtn.innerHTML = '&#127915; Generate Volunteer Certificate';
            });
        });

        function recordRegistration(name, role) {
            volunteerRegistrations.push({
                name:      name,
                role:      role,
                timestamp: new Date().toISOString()
            });
            updateAdminCount();
        }

        function showCertificate(name, role) {
            nameDisplay.textContent = name;
            roleDisplay.textContent = role;
            previewSection.classList.add('visible');

            requestAnimationFrame(function () {
                fitCertificateTexts();
            });

            setTimeout(function () {
                fitCertificateTexts();
                previewSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 100);
        }

        // ============================================================
        //  DOWNLOAD CERTIFICATE AS HIGH-RES PNG
        // ============================================================
        downloadBtn.addEventListener('click', function () {
            const name = (nameDisplay.textContent || 'Volunteer').trim();
            const role = (roleDisplay.textContent || 'Volunteer').trim();
            if (!name) return;

            downloadBtn.disabled = true;
            downloadBtn.textContent = '⏳ Generating Image...';

            tryDirectCanvasDownload(name, role).catch(function () {
                fallbackHtml2CanvasDownload(name);
            });
        });

        // Method 1: Direct Canvas (Fastest, zero jitter, pixel-perfect)
        function tryDirectCanvasDownload(name, role) {
            return new Promise(function (resolve, reject) {
                if (!templateImg.complete || templateImg.naturalWidth === 0) {
                    return reject('Image not fully loaded');
                }

                const W = templateImg.naturalWidth || CERT_WIDTH;
                const H = templateImg.naturalHeight || CERT_HEIGHT;

                const canvas = document.createElement('canvas');
                canvas.width  = W;
                canvas.height = H;
                const ctx = canvas.getContext('2d');

                try {
                    // Draw base template
                    ctx.drawImage(templateImg, 0, 0, W, H);

                    // 1. Draw Participant Name (italic serif)
                    const maxNameWidth = W * 0.60;
                    let fontNameSize = Math.round(W * 0.033); // ~66px on 2000px
                    const minNameFontSize = 24;

                    ctx.font = 'italic 500 ' + fontNameSize + 'px "Georgia", "Times New Roman", serif';
                    while (ctx.measureText(name).width > maxNameWidth && fontNameSize > minNameFontSize) {
                        fontNameSize -= 1;
                        ctx.font = 'italic 500 ' + fontNameSize + 'px "Georgia", "Times New Roman", serif';
                    }

                    ctx.fillStyle = '#1a1a2e';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(name, W * 0.54, H * 0.405);

                    // 2. Draw Volunteer Role (bold serif / sans with background patch over dotted line)
                    const maxRoleWidth = W * 0.56;
                    let fontRoleSize = Math.round(W * 0.019); // ~38px on 2000px
                    const minRoleFontSize = 18;

                    ctx.font = 'bold ' + fontRoleSize + 'px "Georgia", "Times New Roman", serif';
                    while (ctx.measureText(role).width > maxRoleWidth && fontRoleSize > minRoleFontSize) {
                        fontRoleSize -= 1;
                        ctx.font = 'bold ' + fontRoleSize + 'px "Georgia", "Times New Roman", serif';
                    }

                    const roleWidth = ctx.measureText(role).width;
                    const roleX = W * 0.54;
                    const roleY = H * 0.538;

                    // Clean white backing behind text over dotted line
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(roleX - roleWidth / 2 - 16, roleY - fontRoleSize * 0.65, roleWidth + 32, fontRoleSize * 1.3);

                    // Role text
                    ctx.fillStyle = '#c2185b';
                    ctx.fillText(role, roleX, roleY);

                    // Download
                    triggerDownload(canvas.toDataURL('image/png', 1.0), name);
                    finishDownload();
                    resolve();
                } catch (e) {
                    reject(e);
                }
            });
        }

        // Method 2: html2canvas fallback
        function fallbackHtml2CanvasDownload(name) {
            html2canvas(certificateEl, {
                scale: 2,
                useCORS: true,
                allowTaint: true,
                backgroundColor: '#ffffff',
                logging: false
            }).then(function (canvas) {
                triggerDownload(canvas.toDataURL('image/png', 1.0), name);
                finishDownload();
            }).catch(function (err) {
                console.error('html2canvas error:', err);
                showToast('Could not download. Please check image permissions.');
                finishDownload();
            });
        }

        function triggerDownload(dataUrl, name) {
            const safeName = name.replace(/\s+/g, '_');
            const link = document.createElement('a');
            link.download = 'SAC2026_Volunteer_Certificate_' + safeName + '.png';
            link.href = dataUrl;
            link.click();
            showToast('Volunteer Certificate downloaded successfully!');
        }

        function finishDownload() {
            downloadBtn.disabled = false;
            downloadBtn.innerHTML = '&#128190; Download Certificate as Image';
        }

        // ============================================================
        //  BUTTONS & ADMIN ACTIONS
        // ============================================================
        newCertBtn.addEventListener('click', function () {
            form.reset();
            nameDisplay.textContent = '';
            roleDisplay.textContent = '';
            previewSection.classList.remove('visible');
            document.getElementById('fullName').focus();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        resetBtn.addEventListener('click', function () {
            nameDisplay.textContent = '';
            roleDisplay.textContent = '';
            previewSection.classList.remove('visible');
        });

        adminToggle.addEventListener('click', function () {
            adminPanel.classList.toggle('visible');
        });

        exportCsvBtn.addEventListener('click', function () {
            if (volunteerRegistrations.length === 0) {
                showToast('No volunteer registrations to export.');
                return;
            }

            const header = ['Full Name', 'Role', 'Timestamp'];
            const rows = volunteerRegistrations.map(function (r) {
                return [
                    csvEscape(r.name),
                    csvEscape(r.role),
                    csvEscape(r.timestamp)
                ].join(',');
            });

            const csv  = header.join(',') + '\n' + rows.join('\n');
            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const url  = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href     = url;
            link.download = 'SAC2026_Volunteer_Certificates_Log.csv';
            link.click();
            URL.revokeObjectURL(url);

            showToast('CSV exported with ' + volunteerRegistrations.length + ' record(s).');
        });

        function csvEscape(val) {
            if (typeof val !== 'string') val = String(val);
            if (val.includes(',') || val.includes('"') || val.includes('\n')) {
                return '"' + val.replace(/"/g, '""') + '"';
            }
            return val;
        }

        function updateAdminCount() {
            regCount.textContent = volunteerRegistrations.length;
            exportCsvBtn.disabled = volunteerRegistrations.length === 0;
        }

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(showToast._timer);
            showToast._timer = setTimeout(function () {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
